name: Datos y despliegue

# Ver docs/06-roadmap.md#H9 y docs/03-arquitectura.md#Despliegue.
#
# Dos disparadores: cada dos horas (refresco de precios) y al hacer push a
# main (cambios de código). Un mismo workflow para los dos casos: no hace
# falta duplicar nada, el build siempre parte de datos frescos.
#
# Regla dura (RF-05): si el estado histórico anterior no se valida o si
# `npm run data:fetch` falla, el job se detiene antes de desplegar.
# No se llega al paso de build ni de despliegue, así que el sitio publicado
# anteriormente se queda tal cual.
#
# RNF-43: antes de desplegar se comprueba también que ningún fichero de
# public/data/ lleve "mock": true. Ya lo hace "npm run build" por su cuenta
# (ver "comprobar:datos" en package.json), pero se repite aquí como paso
# propio y explícito: si el día de mañana el script de build cambia y deja de
# incluir esa comprobación, el despliegue sigue sin poder publicar datos
# inventados.
on:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reconstruir_historico:
        description: "Reconstruir explícitamente los 90 días desde el MITECO"
        required: false
        type: boolean
        default: false

concurrency:
  group: produccion-surtidor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Recuperar y actualizar la ventana histórica
        run: |
          if [ "${{ inputs.reconstruir_historico || false }}" = "true" ]; then
            npm run preparar:historico -- --reconstruir
          else
            npm run preparar:historico
          fi

      - name: Materializar el histórico por provincia
        run: npm run materializar:historico -- datos-build/estado-historico.json public/data/historico

      - name: Descargar y normalizar los precios del MITECO
        run: npm run data:fetch

      - name: Construir el sitio
        run: npm run build

      - name: Comprobar que no se despliegan datos de prueba (RNF-43)
        run: npm run comprobar:datos

      - name: Desplegar a Cloudflare Pages
        run: npx wrangler pages deploy dist/ --project-name=surtidor --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
